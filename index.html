<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jellyfish0128</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">jellyfish( ꜆⌯' '⌯)꜆♡</div>
    
    <div class="container">
        <button id="enterBtn">Jellyfish</button>
    </div>

    <div id="mainContent" class="hidden">
        <div class="emoji">(˶ᐢ. .ᐢ˵)</div>
        <div id="changingText">初めまして、私は Jellyfish です</div>
        <div class="separator">♡ ••┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈┈•• ♡</div>
        
        <!-- 倒數日期 -->
        <div class="countdown-box">
            <h2>˙˚ʚ水母のcos場次日期倒數ɞ˚˙</h2>
            <p id="countdownText"></p>
        </div>

        <!-- 月曆 -->
        <div class="calendar-box">
            <h2>行程月曆</h2>
            <div id="calendar"></div>
        </div>

        <!-- 便利貼 -->
        <div class="notes-box">
            <h2>便利貼留言板</h2>
            <button id="addNote">新增便利貼</button>
            <div id="notesContainer"></div>
        </div>

        <!-- 代辦事項 -->
        <div class="todo-box">
            <h2>待辦事項</h2>
            <input type="text" id="todoInput" placeholder="今天有什麼要做的嗎꜀(^. .^꜀ )꜆੭">
            <button id="addTodo">添加日程</button>
            <button id="clearTodo">全部完成</button>
            <ul id="todoList"></ul>
        </div>

        <!-- Instagram 連結 -->
        <div class="link-box">
            <a href="https://www.instagram.com/jelly.fish0128?igsh=MWFrNzJxcDE2b3NhMQ%3D%3D&utm_source=qr" target="_blank">Follow me on Instagram</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
